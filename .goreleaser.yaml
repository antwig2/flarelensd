version: 2

project_name: flarelensd

before:
  hooks:
    - go mod tidy

builds:
  - id: flarelensd
    main: ./cmd/agent
    binary: flarelensd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuiltBy=goreleaser

archives:
  - id: archive
    name_template: "flarelensd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*

  - id: raw-binary
    name_template: "flarelensd-{{ .Os }}-{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: antwig2
    name: flarelensd
  draft: false
  prerelease: auto
  make_latest: true
